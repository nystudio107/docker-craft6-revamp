name: Build and Push Docker Images
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
jobs:
  build-composer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        composer: ["2.8"]
    name: craft6-revamp ${{ matrix.composer }} images
    steps:
      - name: Set version tag
        run: |
          echo "TAGS=nystudio107/craft6-revamp:${{ matrix.composer }}" >> $GITHUB_ENV
      - name: Set latest tag
        if: ${{ matrix.composer=='2.8' }}
        run: |
          echo "TAGS=$TAGS,nystudio107/craft6-revamp:latest" >> $GITHUB_ENV
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build nystudio107/craft6-revamp:${{ matrix.composer }}
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.TAGS }}
          build-args: |
            TAG=${{ matrix.composer }}
